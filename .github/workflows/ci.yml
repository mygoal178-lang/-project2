name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck / lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
        env:
          # Build must succeed without real secrets; app uses demo path when unset
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
